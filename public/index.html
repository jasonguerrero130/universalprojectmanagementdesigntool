function parseDate(s) {
  const d = new Date(s + "T00:00:00");
  return isNaN(d.getTime()) ? null : d;
}
function daysBetween(a, b) {
  return Math.max(1, Math.round((b - a) / 86400000));
}
function formatShort(dateStr) {
  const d = parseDate(dateStr);
  if (!d) return "--";
  return d.toLocaleDateString("en-US", { month: "short", day: "numeric" });
}
function formatBudget(amount, code) {
  const cur = CURRENCIES.find((c) => c.code === code) || CURRENCIES[0];
  const num = parseFloat(amount);
  if (isNaN(num)) return `${cur.symbol}0`;
  return `${cur.symbol}${num.toLocaleString("en-US", { maximumFractionDigits: 0 })}`;
}

// CPM: forward + backward pass -> earliest/latest start/finish, float, critical flag
function computeCPM(tasks) {
  const byId = Object.fromEntries(tasks.map((t) => [t.id, t]));
  const dur = {};
  const validTasks = tasks.filter((t) => parseDate(t.start) && parseDate(t.end));
  validTasks.forEach((t) => {
    dur[t.id] = daysBetween(parseDate(t.start), parseDate(t.end));
  });

  // depth via memoized DFS (guards cycles)
  const depth = {};
  const visiting = new Set();
  function getDepth(id) {
    if (depth[id] !== undefined) return depth[id];
    if (visiting.has(id)) return 0;
    visiting.add(id);
    const t = byId[id];
    const deps = (t?.deps || []).filter((d) => byId[d]);
    const dd = deps.length === 0 ? 0 : Math.max(...deps.map(getDepth)) + 1;
    visiting.delete(id);
    depth[id] = dd;
    return dd;
  }
  validTasks.forEach((t) => getDepth(t.id));

  // topological order by depth
  const order = [...validTasks].sort((a, b) => depth[a.id] - depth[b.id]);

  const ES = {}, EF = {};
  order.forEach((t) => {
    const deps = (t.deps || []).filter((d) => byId[d] && dur[d] !== undefined);
    const es = deps.length === 0 ? 0 : Math.max(...deps.map((d) => EF[d] ?? 0));
    ES[t.id] = es;
    EF[t.id] = es + (dur[t.id] || 1);
  });
  const projectDuration = Math.max(0, ...Object.values(EF));

  const successors = {};
  order.forEach((t) => {
    (t.deps || []).forEach((d) => {
      if (!successors[d]) successors[d] = [];
      successors[d].push(t.id);
    });
  });

  const LF = {}, LS = {};
  [...order].reverse().forEach((t) => {
    const succ = successors[t.id] || [];
    const lf = succ.length === 0 ? projectDuration : Math.min(...succ.map((s) => LS[s] ?? projectDuration));
    LF[t.id] = lf;
    LS[t.id] = lf - (dur[t.id] || 1);
  });

  const float = {};
  order.forEach((t) => {
    float[t.id] = (LS[t.id] ?? 0) - (ES[t.id] ?? 0);
  });

  return { depth, ES, EF, LS, LF, float, dur, projectDuration, order };
}

function hasManualBudget(t) {
  const v = parseFloat(t.manualBudget);
  return t.manualBudget !== undefined && t.manualBudget !== null && t.manualBudget !== "" && !isNaN(v) && v >= 0;
}

function getExpenditureBreakdown(t) {
  const e = t.expenditure || {};
  const materials = parseFloat(e.materials) || 0;
  const labor = parseFloat(e.labor) || 0;
  const other = parseFloat(e.other) || 0;
  return { materials, labor, other };
}

function getActualSpent(t) {
  if (t.expenditure) {
    const { materials, labor, other } = getExpenditureBreakdown(t);
    return materials + labor + other;
  }
  // legacy fallback for tasks saved before the materials/labor/other breakdown existed
  return parseFloat(t.actualSpent) || 0;
}

function computeCostAllocation(tasks, budget) {
  const total = parseFloat(budget);
  const valid = tasks.filter((t) => t.name);

  const overrideTasks = valid.filter(hasManualBudget);
  const overrideIds = new Set(overrideTasks.map((t) => t.id));
  const overrideSum = overrideTasks.reduce((s, t) => s + Math.max(0, parseFloat(t.manualBudget)), 0);
  const remainingBudget = isNaN(total) ? 0 : Math.max(0, total - overrideSum);

  const weightTasks = valid.filter((t) => !overrideIds.has(t.id));
  const weights = weightTasks.map((t) => {
    const w = parseFloat(t.weight);
    return isNaN(w) || w <= 0 ? 1 : w;
  });
  const sumW = weights.reduce((a, b) => a + b, 0) || 1;

  const alloc = {};
  const share = {};
  overrideTasks.forEach((t) => {
    alloc[t.id] = Math.max(0, parseFloat(t.manualBudget));
    share[t.id] = isNaN(total) || total <= 0 ? 0 : alloc[t.id] / total;
  });
  weightTasks.forEach((t, i) => {
    const s = weights[i] / sumW;
    alloc[t.id] = remainingBudget * s;
    share[t.id] = isNaN(total) || total <= 0 ? 0 : alloc[t.id] / total;
  });

  const avgShare = 1 / valid.length;
  return { alloc, share, avgShare, sumW, overrideIds };
}

function relaxSchedule(dur, deps) {
  const n = dur.length;
  const ES = new Array(n).fill(0);
  const EF = new Array(n).fill(0);
  for (let pass = 0; pass < n; pass++) {
    for (let i = 0; i < n; i++) {
      const depEF = deps[i].map((d) => EF[d]);
      const es = depEF.length ? Math.max(...depEF) : 0;
      ES[i] = es;
      EF[i] = es + dur[i];
    }
  }
  return { ES, EF };
}

}
function wbsColorFor(owner, ownersList) {
  const idx = Math.max(0, ownersList.indexOf(owner || "Unassigned"));
  return WBS_COLORS[idx % WBS_COLORS.length];
}

function truncateToLastValidJSON(str) {
  const stack = [];
  let inString = false, escape = false;
  let lastSafeEnd = -1;
  for (let i = 0; i < str.length; i++) {
    const ch = str[i];
    if (inString) {
      if (escape) escape = false;
      else if (ch === "\\") escape = true;
      else if (ch === '"') inString = false;
      continue;
    }
    if (ch === '"') { inString = true; continue; }
    if (ch === "{" || ch === "[") stack.push(ch);
    else if (ch === "}" || ch === "]") {
      stack.pop();
      if (stack.length <= 1) lastSafeEnd = i;
    }
  }
  if (lastSafeEnd === -1) return null;
  let truncated = str.slice(0, lastSafeEnd + 1).replace(/,\s*$/, "");
  if (truncated[truncated.length - 1] !== "]") truncated += "]";
  return truncated;
}

function extractJSONArray(text) {
  const cleaned = (text || "").replace(/```json/gi, "").replace(/```/g, "").trim();
  const start = cleaned.indexOf("[");
  const rawArraySlice = start !== -1 ? cleaned.slice(start) : cleaned;
  try {
    return JSON.parse(cleaned);
  } catch (e) {
    try {
      const end = cleaned.lastIndexOf("]");
      if (start !== -1 && end !== -1 && end > start) {
        return JSON.parse(cleaned.slice(start, end + 1));
      }
      throw e;
    } catch (e2) {
      const repaired = truncateToLastValidJSON(rawArraySlice);
      if (repaired) {
        try {
          return JSON.parse(repaired);
        } catch (e3) {
          /* fall through to error below */
        }
      }
      throw new Error("Model reply was cut off or malformed near: " + cleaned.slice(0, 160));
    }
  }
}

async function callClaude(prompt, maxTokens, email, name, anonId) {
  const response = await fetch("/api/generate", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ email, name, anonId, prompt, maxTokens: maxTokens || 1000 }),
  });
  let data;
  try {
    data = await response.json();
  } catch (e) {
    throw new Error("Server returned a non-JSON response (HTTP " + response.status + ")");
  }
  if (response.status === 402 || (data && data.error === "limit_reached")) {
    const err = new Error((data && data.message) || "You've used your free generations — subscribe to keep going.");
    err.code = "limit_reached";
    throw err;
  }
  if (!response.ok) {
    throw new Error((data && (data.message || data.error)) || "Request failed (HTTP " + response.status + ")");
  }
  if (!data || !data.text) throw new Error("Model returned an empty response");
  return { text: data.text, remaining: data.remaining, subscribed: data.subscribed, accessExpiresAt: data.accessExpiresAt };
}

function TaskEditor({ task, allTasks, onChange, onRemove, index }) {
  const toggleDep = (id) => {
    const has = task.deps.includes(id);
    const next = has ? task.deps.filter((d) => d !== id) : [...task.deps, id];
    onChange({ ...task, deps: next });
  };
  return (
    <div className="pbd-task">
      <div className="pbd-task-head">
        <span className="pbd-task-tag">TASK {String(index + 1).padStart(2, "0")}</span>
        <button className="pbd-remove" onClick={onRemove} aria-label="Remove task">✕</button>
      </div>
      <input
        className="pbd-input"
        placeholder="Task or phase name"
        value={task.name}
        onChange={(e) => onChange({ ...task, name: e.target.value })}
      />
      <div className="pbd-row2" style={{ marginTop: 8 }}>
        <div>
          <span className="pbd-label" style={{ marginTop: 0 }}>Start</span>
          <input
            type="date"
            className="pbd-input"
            value={task.start}
            onChange={(e) => onChange({ ...task, start: e.target.value })}
          />
        </div>
        <div>
          <span className="pbd-label" style={{ marginTop: 0 }}>End</span>
          <input
            type="date"
            className="pbd-input"
            value={task.end}
            onChange={(e) => onChange({ ...task, end: e.target.value })}
          />
        </div>
      </div>
      {allTasks.length > 1 && (
        <>
          <span className="pbd-label">Depends on</span>
          <div className="pbd-deps">
            {allTasks
              .filter((t) => t.id !== task.id)
              .map((t) => (
                <button
                  key={t.id}
                  className={`pbd-chip ${task.deps.includes(t.id) ? "active" : ""}`}
                  onClick={() => toggleDep(t.id)}
                  type="button"
                >
                  {t.name || "Untitled"}
                </button>
              ))}
          </div>
        </>
      )}
      <span className="pbd-label">Budget weight (relative share, default 1)</span>
      <input
        type="number"
        min="0.1"
        step="0.1"
        className="pbd-input"
        value={task.weight ?? 1}
        onChange={(e) => onChange({ ...task, weight: e.target.value })}
        disabled={task.manualBudget !== undefined && task.manualBudget !== null && task.manualBudget !== ""}
      />
      <span className="pbd-label">Direct budget amount (optional — overrides weight)</span>
      <input
        type="number"
        min="0"
        step="1"
        className="pbd-input"
        placeholder="auto (weight-based)"
        value={task.manualBudget ?? ""}
        onChange={(e) => onChange({ ...task, manualBudget: e.target.value })}
      />
      {task.manualBudget !== undefined && task.manualBudget !== null && task.manualBudget !== "" && (
        <div className="pbd-gen-status" style={{ marginTop: 4, marginBottom: 0, opacity: 0.7 }}>
          Fixed — other tasks split the rest by weight. Clear to go back to weight-based.
        </div>
      )}
      <span className="pbd-label">Actual expenditure breakdown</span>
      <div className="pbd-row3">
        <div>
          <span className="pbd-sublabel">Materials</span>
          <input
            type="number"
            min="0"
            step="1"
            className="pbd-input"
            placeholder="0"
            value={task.expenditure?.materials ?? 0}
            onChange={(e) =>
              onChange({ ...task, expenditure: { ...getExpenditureBreakdown(task), materials: e.target.value } })
            }
          />
        </div>
        <div>
          <span className="pbd-sublabel">Labor</span>
          <input
            type="number"
            min="0"
            step="1"
            className="pbd-input"
            placeholder="0"
            value={task.expenditure?.labor ?? 0}
            onChange={(e) =>
              onChange({ ...task, expenditure: { ...getExpenditureBreakdown(task), labor: e.target.value } })
            }
          />
        </div>
        <div>
          <span className="pbd-sublabel">Other</span>
          <input
            type="number"
            min="0"
            step="1"
            className="pbd-input"
            placeholder="0"
            value={task.expenditure?.other ?? 0}
            onChange={(e) =>
              onChange({ ...task, expenditure: { ...getExpenditureBreakdown(task), other: e.target.value } })
            }
          />
        </div>
      </div>
      <div className="pbd-actual-total">Total actual: {getActualSpent(task).toLocaleString("en-US", { maximumFractionDigits: 0 })}</div>
      <span className="pbd-label">% Complete</span>
      <input
        type="number"
        min="0"
        max="100"
        step="5"
        className="pbd-input"
        value={task.progress ?? 0}
        onChange={(e) => {
          const v = Math.min(100, Math.max(0, Number(e.target.value) || 0));
          onChange({ ...task, progress: v });
        }}
      />
    </div>
  );
}

function TimelineView({ tasks, cpm, project }) {
  const valid = tasks.filter((t) => parseDate(t.start) && parseDate(t.end) && t.name);
  if (valid.length === 0) return <div className="pbd-empty">Add tasks in Block 05 to draft the timeline.</div>;

  const starts = valid.map((t) => parseDate(t.start));
  const ends = valid.map((t) => parseDate(t.end));
  const rangeStart = new Date(Math.min(...starts));
  const rangeEnd = new Date(Math.max(...ends));
  const totalDays = Math.max(1, daysBetween(rangeStart, rangeEnd));

  const marginLeft = 190;
  const marginTop = 34;
  const rowH = 38;
  const chartWidth = Math.max(600, totalDays * 7);
  const width = marginLeft + chartWidth + 40;
  const height = marginTop + valid.length * rowH + 30;

  const xFor = (dateStr) => {
    const d = parseDate(dateStr);
    return marginLeft + ((d - rangeStart) / 86400000 / totalDays) * chartWidth;
  };

  // month gridlines
  const months = [];
  let cursor = new Date(rangeStart.getFullYear(), rangeStart.getMonth(), 1);
  while (cursor <= rangeEnd) {
    months.push(new Date(cursor));
    cursor = new Date(cursor.getFullYear(), cursor.getMonth() + 1, 1);
  }

  const today = new Date("2026-08-03T00:00:00");
  const todayX = today >= rangeStart && today <= rangeEnd ? xFor(today.toISOString().slice(0, 10)) : null;

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      {months.map((m, i) => {
        const x = marginLeft + Math.max(0, (m - rangeStart) / 86400000 / totalDays) * chartWidth;
        return (
          <g key={i}>
            <line x1={x} y1={marginTop - 10} x2={x} y2={height - 10} stroke="rgba(126,200,227,0.18)" strokeDasharray="2,3" />
            <text x={x + 5} y={marginTop - 16} fill="#7ec8e3" fontSize="10.5" fontFamily="IBM Plex Mono, monospace">
              {m.toLocaleDateString("en-US", { month: "short", year: "2-digit" })}
            </text>
          </g>
        );
      })}
      {todayX !== null && (
        <g>
          <line x1={todayX} y1={marginTop - 10} x2={todayX} y2={height - 10} stroke="#f2a93b" strokeWidth="1.5" />
          <text x={todayX + 4} y={height - 14} fill="#f2a93b" fontSize="10" fontFamily="IBM Plex Mono, monospace">TODAY</text>
        </g>
      )}
      {valid.map((t, i) => {
        const y = marginTop + i * rowH;
        const x1 = xFor(t.start);
        const x2 = xFor(t.end);
        const isCritical = cpm.float[t.id] === 0;
        const dur = cpm.dur[t.id] || 1;
        const pct = Math.min(100, Math.max(0, Number(t.progress) || 0));
        const barW = Math.max(4, x2 - x1);
        const barH = rowH - 16;
        return (
          <g key={t.id}>
            <text x={0} y={y + rowH / 2 - 8} fill="#f4fbff" fontSize="12" fontFamily="Inter, sans-serif">
              {t.name.length > 24 ? t.name.slice(0, 23) + "…" : t.name}
            </text>
            <text x={0} y={y + rowH / 2 + 6} fill="#547d94" fontSize="9.5" fontFamily="IBM Plex Mono, monospace">
              {formatShort(t.start)} – {formatShort(t.end)} · {dur}d
            </text>
            <rect
              x={x1}
              y={y + 4}
              width={barW}
              height={barH}
              rx="3"
              fill={isCritical ? "rgba(242,169,59,0.28)" : "rgba(126,200,227,0.22)"}
              stroke={isCritical ? "#f2a93b" : "#7ec8e3"}
              strokeWidth="1.4"
            />
            {pct > 0 && (
              <rect
                x={x1}
                y={y + 4}
                width={(barW * pct) / 100}
                height={barH}
                rx="3"
                fill={isCritical ? "#f2a93b" : "#7ec8e3"}
                opacity="0.55"
              />
            )}
            {barW > 34 && (
              <text
                x={x1 + barW - 6}
                y={y + rowH / 2 + 4}
                fill="#f4fbff"
                fontSize="9.5"
                fontFamily="IBM Plex Mono, monospace"
                textAnchor="end"
              >
                {pct}%
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

function NetworkView({ tasks, cpm }) {
  const valid = tasks.filter((t) => parseDate(t.start) && parseDate(t.end) && t.name);
  if (valid.length === 0) return <div className="pbd-empty">Add tasks in Block 05 to draft the network diagram.</div>;

  const byDepth = {};
  valid.forEach((t) => {
    const d = cpm.depth[t.id] ?? 0;
    if (!byDepth[d]) byDepth[d] = [];
    byDepth[d].push(t);
  });
  const depths = Object.keys(byDepth).map(Number).sort((a, b) => a - b);

  const nodeW = 168, nodeH = 94, colGap = 70, rowGap = 26;
  const marginLeft = 30, marginTop = 30;
  const maxRows = Math.max(...depths.map((d) => byDepth[d].length));
  const width = marginLeft * 2 + depths.length * (nodeW + colGap);
  const height = marginTop * 2 + maxRows * (nodeH + rowGap);

  const pos = {};
  depths.forEach((d, ci) => {
    byDepth[d].forEach((t, ri) => {
      pos[t.id] = {
        x: marginLeft + ci * (nodeW + colGap),
        y: marginTop + ri * (nodeH + rowGap),
      };
    });
  });

  const byId = Object.fromEntries(valid.map((t) => [t.id, t]));
  const edges = [];
  valid.forEach((t) => {
    (t.deps || []).forEach((d) => {
      if (pos[d] && pos[t.id]) {
        const critical = cpm.float[d] === 0 && cpm.float[t.id] === 0 && cpm.EF[d] === cpm.ES[t.id];
        edges.push({ from: d, to: t.id, critical });
      }
    });
  });

  return (
    <svg width={width} height={height} style={{ display: "block" }}>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#7ec8e3" />
        </marker>
        <marker id="arrowCritical" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
          <path d="M0,0 L6,3 L0,6 Z" fill="#f2a93b" />
        </marker>
      </defs>
      {edges.map((e, i) => {
        const p1 = pos[e.from], p2 = pos[e.to];
        const x1 = p1.x + nodeW, y1 = p1.y + nodeH / 2;
        const x2 = p2.x, y2 = p2.y + nodeH / 2;
        const midX = x1 + (x2 - x1) / 2;
        const path = `M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}`;
        return (
          <path
            key={i}
            d={path}
            fill="none"
            stroke={e.critical ? "#f2a93b" : "#7ec8e3"}
            strokeWidth={e.critical ? 2 : 1.3}
            opacity={e.critical ? 0.9 : 0.55}
            markerEnd={e.critical ? "url(#arrowCritical)" : "url(#arrow)"}
          />
        );
      })}
      {valid.map((t) => {
        const p = pos[t.id];
        const critical = cpm.float[t.id] === 0;
        const pct = Math.min(100, Math.max(0, Number(t.progress) || 0));
        return (
          <g key={t.id} transform={`translate(${p.x},${p.y})`}>
            <rect
              width={nodeW}
              height={nodeH}
              rx="3"
              fill="rgba(9,26,43,0.85)"
              stroke={critical ? "#f2a93b" : "#7ec8e3"}
              strokeWidth={critical ? 1.8 : 1.2}
            />
            <text x={10} y={20} fill="#f4fbff" fontSize="11.5" fontFamily="Inter, sans-serif" fontWeight="600">
              {t.name.length > 20 ? t.name.slice(0, 19) + "…" : t.name}
            </text>
            <line x1={10} y1={30} x2={nodeW - 10} y2={30} stroke="rgba(126,200,227,0.25)" />
            <text x={10} y={44} fill="#7ec8e3" fontSize="9.5" fontFamily="IBM Plex Mono, monospace">
              ES {cpm.ES[t.id]}d · EF {cpm.EF[t.id]}d
            </text>
            <text x={10} y={57} fill="#c792ea" fontSize="9.5" fontFamily="IBM Plex Mono, monospace">
              LS {cpm.LS[t.id]}d · LF {cpm.LF[t.id]}d
            </text>
            <text x={10} y={70} fill="#547d94" fontSize="9.5" fontFamily="IBM Plex Mono, monospace">
              FLOAT {cpm.float[t.id]}d · {pct}%
            </text>
            <rect x={10} y={nodeH - 12} width={nodeW - 20} height={4} rx="2" fill="rgba(126,200,227,0.15)" />
            <rect
              x={10}
              y={nodeH - 12}
              width={Math.max(2, ((nodeW - 20) * pct) / 100)}
              height={4}
              rx="2"
              fill={critical ? "#f2a93b" : "#7ec8e3"}
            />
            {critical && (
              <text x={nodeW - 10} y={20} fill="#f2a93b" fontSize="9" fontFamily="IBM Plex Mono, monospace" textAnchor="end">
                CRIT
              </text>
            )}
          </g>
        );
      })}
    </svg>
  );
}

function CostView({ tasks, cpm, project }) {
  const valid = tasks.filter((t) => parseDate(t.start) && parseDate(t.end) && t.name);
  if (valid.length === 0) return <div className="pbd-empty">Add tasks in Block 05 to draft the cost breakdown.</div>;

  const { alloc, share, avgShare, overrideIds } = computeCostAllocation(valid, project.budget);

  const totalBudget = parseFloat(project.budget) || 0;
  const totalActual = valid.reduce((s, t) => s + getActualSpent(t), 0);
  const totalRemaining = totalBudget - totalActual;

  const byDepth = {};
  valid.forEach((t) => {
    const d = cpm.depth[t.id] ?? 0;
    if (!byDepth[d]) byDepth[d] = [];
    byDepth[d].push(t);
  });
  const depths = Object.keys(byDepth).map(Number).sort((a, b) => a - b);

  const nodeW = 176, nodeH = 132, colGap = 70, rowGap = 26;
  const marginLeft = 30, marginTop = 30;
  const maxRows = Math.max(...depths.map((d) => byDepth[d].length));
  const width = marginLeft * 2 + depths.length * (nodeW + colGap);
  const height = marginTop * 2 + maxRows * (nodeH + rowGap);

  const pos = {};
  depths.forEach((d, ci) => {
    byDepth[d].forEach((t, ri) => {
      pos[t.id] = {
        x: marginLeft + ci * (nodeW + colGap),
        y: marginTop + ri * (nodeH + rowGap),
      };
    });
  });

  const maxShare = Math.max(...valid.map((t) => share[t.id]));
  const edges = [];
  valid.forEach((t) => {
    (t.deps || []).forEach((d) => {
      if (pos[d] && pos[t.id]) edges.push({ from: d, to: t.id });
    });
  });

  return (
    <div>
      <div className="pbd-cost-summary">
        <div className="pbd-cost-chip">
          <div className="pbd-cost-chip-label">Total Budget</div>
          <div className="pbd-cost-chip-value">{formatBudget(totalBudget, project.currency)}</div>
        </div>
        <div className="pbd-cost-chip">
          <div className="pbd-cost-chip-label">Actual Expenditure</div>
          <div className="pbd-cost-chip-value">{formatBudget(totalActual, project.currency)}</div>
        </div>
        <div className="pbd-cost-chip">
          <div className="pbd-cost-chip-label">Remaining Budget</div>
          <div className="pbd-cost-chip-value" style={{ color: totalRemaining < 0 ? "#ff9d7a" : "#8fd694" }}>
            {formatBudget(totalRemaining, project.currency)}
          </div>
        </div>
      </div>
      <svg width={width} height={height} style={{ display: "block" }}>
        <defs>
          <marker id="arrowCost" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path d="M0,0 L6,3 L0,6 Z" fill="#7ec8e3" />
          </marker>
        </defs>
        {edges.map((e, i) => {
          const p1 = pos[e.from], p2 = pos[e.to];
          const x1 = p1.x + nodeW, y1 = p1.y + nodeH / 2;
          const x2 = p2.x, y2 = p2.y + nodeH / 2;
          const midX = x1 + (x2 - x1) / 2;
          const path = `M${x1},${y1} L${midX},${y1} L${midX},${y2} L${x2},${y2}`;
          return <path key={i} d={path} fill="none" stroke="#7ec8e3" strokeWidth="1.3" opacity="0.5" markerEnd="url(#arrowCost)" />;
        })}
        {valid.map((t) => {
          const p = pos[t.id];
          const s = share[t.id];
          const aboveAvg = s > avgShare * 1.15;
          const barW = (nodeW - 20) * (maxShare ? s / maxShare : 0);
          const allocated = alloc[t.id] || 0;
          const actual = getActualSpent(t);
          const breakdown = getExpenditureBreakdown(t);
          const remaining = allocated - actual;
          const overBudget = remaining < 0;
          const spentFrac = allocated > 0 ? Math.min(1.4, actual / allocated) : 0;
          return (
            <g key={t.id} transform={`translate(${p.x},${p.y})`}>
              <rect
                width={nodeW}
                height={nodeH}
                rx="3"
                fill="rgba(9,26,43,0.85)"
                stroke={overBudget ? "#ff9d7a" : aboveAvg ? "#f2a93b" : "#7ec8e3"}
                strokeWidth={overBudget || aboveAvg ? 1.8 : 1.2}
              />
              <text x={10} y={20} fill="#f4fbff" fontSize="11.5" fontFamily="Inter, sans-serif" fontWeight="600">
                {t.name.length > 20 ? t.name.slice(0, 19) + "…" : t.name}
              </text>

function computeExecutiveStats(tasks, project, cpm) {
  const valid = tasks.filter((t) => t.name && parseDate(t.start) && parseDate(t.end));
  if (valid.length === 0) return null;

  const weights = valid.map((t) => {
    const w = parseFloat(t.weight);
    return isNaN(w) || w <= 0 ? 1 : w;
  });
  const sumW = weights.reduce((a, b) => a + b, 0) || 1;

  const overallProgress =
    valid.reduce((sum, t, i) => sum + Math.min(100, Math.max(0, Number(t.progress) || 0)) * weights[i], 0) / sumW;

  const totalBudget = parseFloat(project.budget) || 0;
  const totalActualEntered = valid.reduce((s, t) => s + getActualSpent(t), 0);
  const estimatedSpent = valid.reduce((sum, t, i) => {
    const pct = Math.min(100, Math.max(0, Number(t.progress) || 0)) / 100;
    return sum + totalBudget * (weights[i] / sumW) * pct;
  }, 0);
  const usingActuals = totalActualEntered > 0;
  const spent = usingActuals ? totalActualEntered : estimatedSpent;
  const spentPct = totalBudget > 0 ? (spent / totalBudget) * 100 : 0;
  const remaining = totalBudget - spent;

  const today = new Date("2026-08-03T00:00:00");
  const start = parseDate(project.startDate);
  const end = parseDate(project.endDate);
  let daysRemaining = null, elapsedPct = null;
  if (start && end && end > start) {
    const totalSpan = daysBetween(start, end);
    const elapsed = Math.max(0, Math.min(totalSpan, daysBetween(start, today)));
    elapsedPct = (elapsed / totalSpan) * 100;
    daysRemaining = Math.round((end - today) / 86400000);
  }

  let scheduleStatus = "On Track";
  if (elapsedPct !== null) {
    const gap = elapsedPct - overallProgress;
    if (gap > 20) scheduleStatus = "Delayed";
    else if (gap > 8) scheduleStatus = "At Risk";
  }

  const criticalCount = valid.filter((t) => cpm.float[t.id] === 0).length;
  const completedTasks = valid.filter((t) => (Number(t.progress) || 0) >= 100).length;

  return {
    overallProgress,
    totalBudget,
    spent,
    spentPct,
    remaining,
    usingActuals,
    daysRemaining,
    elapsedPct,
    scheduleStatus,
    criticalCount,
    totalTasks: valid.length,
    completedTasks,
  };
}

const STATUS_COLORS = { "On Track": "#8fd694", "At Risk": "#f2a93b", Delayed: "#ff9d7a" };

function linesToList(str) {
  return (str || "")
    .split("\n")
    .map((s) => s.trim())

function escapeHtml(str) {
  return String(str ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;");
}

        if (data.project) setProject(data.project);
        if (data.tasks) setTasks(data.tasks);

    try {

      if (!id) {
        id = (window.crypto && window.crypto.randomUUID) ? window.crypto.randomUUID() : `anon-${Date.now()}-${Math.random().toString(36).slice(2)}`;
        localStorage.setItem("pbd-anon-id", id);
      }
      setAnonId(id);
    } catch (e) {
      /* ignore — anonId stays null, generate calls will just fail gracefully */
    }

    try {
      const params = new URLSearchParams(window.location.search);
      if (params.get("checkout") === "success") {
        setSaveStatus("Subscription active — unlimited generations unlocked");
        window.history.replaceState({}, "", window.location.pathname);
      } else if (params.get("checkout") === "cancel") {
        window.history.replaceState({}, "", window.location.pathname);
      }
    } catch (e) {
      /* ignore */
    }
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, []);

  function ensureEmail() {
    if (userEmail && userName) return Promise.resolve(userEmail);
    return new Promise((resolve) => {
      setEmailDraft(userEmail || "");
      setNameDraft(userName || "");
      setEmailResolver(() => resolve);
      setShowEmailModal(true);

  const confirmEmail = () => {
    const email = emailDraft.trim();
    const name = nameDraft.trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) || !name) return;
    try {
      localStorage.setItem("pbd-email", email);
      localStorage.setItem("pbd-name", name);
    } catch (e) {
      /* ignore */
    }
    setUserEmail(email);
    setUserName(name);
    setShowEmailModal(false);
    if (emailResolver) emailResolver(email);
    setEmailResolver(null);
  };

  const cancelEmail = () => {
    setShowEmailModal(false);
    if (emailResolver) emailResolver(null);
    setEmailResolver(null);
  };

    const email = userEmail || (await ensureEmail());
    if (!email) return; // they cancelled the sign-in modal

    if (PAYMENTS_ENABLED) {
      setShowPaywall(true);
    } else if (setMessage) {
      setMessage(`Thanks! You're on our early access list at ${email}. We'll let you know as soon as paid plans open.`);

  const startCheckout = async () => {
    setCheckoutLoading(true);
    try {
      const email = userEmail || (await ensureEmail());
      if (!email) {
        setCheckoutLoading(false);
        return;
      }
      const res = await fetch("/api/paymongo-checkout", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ email, name: userName, plan: selectedPlan }),
      });
      const data = await res.json();
      if (data && data.url) {
        window.location.href = data.url;
      } else {
        setSaveStatus((data && data.message) || "Couldn't start checkout — try again");

      setSaveStatus("Couldn't start checkout — try again");
      setCheckoutLoading(false);
    }

    setSaveStatus(null);
    try {
      const payload = JSON.stringify({ project, tasks, savedAt: new Date().toISOString() });
      localStorage.setItem("pbd-project-data", payload);

      const a = document.createElement("a");
      const slug = (project.name || "project").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/(^-|-$)/g, "");

      a.download = `${slug || "project"}-blueprint.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setSaveStatus("Exported");

      setSaveStatus("Export failed");

    const file = e.target.files && e.target.files[0];

        const data = JSON.parse(evt.target.result);

        const depNames = (t.deps || [])
          .map((id) => named.find((x) => x.id === id))
          .filter(Boolean)
          .map((d) => d.name)
          .join(", ");
        const allocated = alloc[t.id] || 0;
        const bd = getExpenditureBreakdown(t);

          `${Math.round(Number(t.progress) || 0)}%`,
          t.weight ?? 1,
          allocated,
          bd.materials,

          bd.other,
          actual,
          allocated - actual,

      });
      XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(taskRows), "Tasks");

[{"name": "Activity name", "durationDays": 7, "dependsOn": [0,1], "costWeight": 2}]

Rules:
- "dependsOn" holds zero-based indices of OTHER activities in this same array that must finish before this one starts. Use [] for activities with no prerequisites.
- durationDays is a realistic whole number of working days for this specific project's scope and budget.
- "costWeight" is a relative number (not a percentage) reflecting how much of the total budget this activity should consume compared to the others — e.g. a heavy build/construction/execution phase might be 3-4x a light planning phase which could be 1. Base it on realistic cost drivers for this type of project (labor-heavy vs material-heavy vs licensing-heavy, etc).

Project name: ${project.name}
Client: ${project.client || "n/a"}
Location: ${project.location || "n/a"}
Objective: ${project.objective || "n/a"}
Approach/methodology: ${project.methodology}
Start date: ${project.startDate}
Target end date: ${project.endDate}
Budget: ${formatBudget(project.budget, project.currency)}
Additional instructions: ${project.notes || "none"}`;

      const arr = extractJSONArray(text);
      if (!Array.isArray(arr) || arr.length === 0) throw new Error("Model returned no activities");

      const ids = arr.map(() => uid());
      const dur = arr.map((a) => Math.max(1, Math.round(Number(a.durationDays)) || 1));
      const deps = arr.map((a) =>
        Array.isArray(a.dependsOn) ? a.dependsOn.filter((i) => Number.isInteger(i) && i >= 0 && i < arr.length) : []
      );
      const ES = new Array(arr.length).fill(0);
      const EF = new Array(arr.length).fill(0);
      // relax repeatedly so order doesn't have to be strictly topological
      for (let pass = 0; pass < arr.length; pass++) {
        arr.forEach((_, i) => {
          const depEF = deps[i].map((d) => EF[d]);
          const es = depEF.length ? Math.max(...depEF) : 0;

        start: addDays(startBase, ES[i]),
        end: addDays(startBase, EF[i]),
        deps: deps[i].map((d) => ids[d]),
        weight: (() => {

          return isNaN(w) || w <= 0 ? 1 : w;
        })(),
        progress: 0,
        expenditure: { materials: 0, labor: 0, other: 0 },

      setTasks(newTasks);
      const lastEF = Math.max(...EF);
      setProject((p) => ({ ...p, endDate: addDays(startBase, lastEF) }));

      const idxToId = namedTasks.map((t) => t.id);

      arr.forEach((entry) => {

          owner: s.owner || "Unassigned",
          progress: 0,
        }));
        updates[parentId] = newSubs;
      });
      if (Object.keys(updates).length === 0) throw new Error("Model response didn't match any current tasks");
      setTasks((ts) => ts.map((t) => (updates[t.id] ? { ...t, subtasks: updates[t.id] } : t)));

Additional instructions: ${project.notes || "none"}

Tasks:

                  allTasks={tasks}
                  onChange={(next) => updateTask(t.id, next)}
                  onRemove={() => removeTask(t.id)}
                />
              ))}
              <button className="pbd-add-btn" onClick={addTask} type="button">+ ADD TASK BLOCK</button>
            </div>

            <div className="pbd-block">
              <div className="pbd-block-num">06 — ADDITIONAL NOTES</div>
              <textarea
                className="pbd-textarea"
                value={project.notes}
                onChange={(e) => updateProject("notes", e.target.value)}
                placeholder="Any other specific instructions — constraints, stakeholders, risks, standards to follow"
                style={{ minHeight: 80 }}
              />
            </div>

            <div className="pbd-block">
              <div className="pbd-block-num">07 — WORK BREAKDOWN & OWNERSHIP</div>
              <button
                className="pbd-gen-btn"
                type="button"
                onClick={generateWBS}
                disabled={wbsGenerating || tasks.filter((t) => t.name.trim()).length === 0}
              >
                {wbsGenerating ? "BREAKING DOWN TASKS…" : "✨ GENERATE WBS & ASSIGN OWNERS"}
              </button>
              {tasks.filter((t) => t.name.trim()).length === 0 && !wbsGenerating && (
                <div className="pbd-gen-status">Add at least one named task in Block 05 first.</div>
              )}
              {wbsError && <div className="pbd-gen-error">{wbsError}</div>}
              {tasks.some((t) => (t.subtasks || []).length > 0) && (
                <div className="pbd-gen-status" style={{ opacity: 0.7 }}>
                  Regenerating replaces existing subtasks per task with a fresh draft.
                </div>
              )}
              {tasks
                .filter((t) => t.name.trim() && (t.subtasks || []).length > 0)
                .map((t) => (
                  <div key={t.id} className="pbd-wbs-group">
                    <div className="pbd-wbs-group-title">{t.name}</div>
                    {(t.subtasks || []).map((st) => (
                      <div key={st.id} className="pbd-subtask">
                        <input
                          className="pbd-input"
                          placeholder="Subtask name"
                          value={st.name}
                          onChange={(e) => updateSubtask(t.id, st.id, { ...st, name: e.target.value })}
                        />
                        <div className="pbd-row2" style={{ marginTop: 6 }}>
                          <input
                            type="number"
                            min="1"
                            className="pbd-input"
                            placeholder="Days"
                            value={st.durationDays}
                            onChange={(e) => updateSubtask(t.id, st.id, { ...st, durationDays: e.target.value })}
                          />
                          <input
                            className="pbd-input"
                            placeholder="Owner / responsible"
                            value={st.owner}
                            onChange={(e) => updateSubtask(t.id, st.id, { ...st, owner: e.target.value })}
                          />
                        </div>
                        <div style={{ marginTop: 6 }}>
                          <span className="pbd-label" style={{ marginTop: 0 }}>% Complete</span>
                          <input
                            type="number"
                            min="0"
                            max="100"
                            step="5"
                            className="pbd-input"
                            value={st.progress ?? 0}
                            onChange={(e) => {
                              const v = Math.min(100, Math.max(0, Number(e.target.value) || 0));
                              updateSubtask(t.id, st.id, { ...st, progress: v });
                            }}
                          />
                        </div>
                        <button className="pbd-subtask-remove" onClick={() => removeSubtask(t.id, st.id)} type="button">
                          ✕ REMOVE SUBTASK
                        </button>
                      </div>
                    ))}
                    <button className="pbd-add-btn" onClick={() => addSubtask(t.id)} type="button">
                      + ADD SUBTASK
                    </button>
                  </div>
                ))}
            </div>

            <div className="pbd-block">
              <div className="pbd-block-num">08 — EXECUTIVE SUMMARY</div>
              <button
                className="pbd-gen-btn"
                type="button"
                onClick={generateSummary}
                disabled={summaryGenerating || !execStats}
              >
                {summaryGenerating ? "DRAFTING SUMMARY…" : "✨ GENERATE EXECUTIVE SUMMARY"}
              </button>
              {!execStats && !summaryGenerating && (
                <div className="pbd-gen-status">Add tasks with dates in Block 05 first.</div>
              )}
              {summaryError && <div className="pbd-gen-error">{summaryError}</div>}
              <div className="pbd-gen-status" style={{ opacity: 0.7 }}>One item per line in each field below.</div>

              <span className="pbd-label" style={{ marginTop: 0 }}>Overall summary</span>
              <textarea
                className="pbd-textarea"
                value={project.summary}
                onChange={(e) => updateProject("summary", e.target.value)}
                placeholder="Executive-level narrative of current status"
              />
              <span className="pbd-label">Highlights</span>
              <textarea
                className="pbd-textarea"
                value={project.highlights}
                onChange={(e) => updateProject("highlights", e.target.value)}
                placeholder="One highlight per line"
              />
              <span className="pbd-label">Ongoing issues</span>
              <textarea
                className="pbd-textarea"
                value={project.issues}
                onChange={(e) => updateProject("issues", e.target.value)}
                placeholder="One issue per line"
              />
              <span className="pbd-label">Potential risks</span>
              <textarea
                className="pbd-textarea"
                value={project.risks}
                onChange={(e) => updateProject("risks", e.target.value)}
                placeholder="One risk per line"
              />
              <span className="pbd-label">Next steps</span>
              <textarea
                className="pbd-textarea"
                value={project.nextSteps}
                onChange={(e) => updateProject("nextSteps", e.target.value)}
                placeholder="One next step per line"
              />
            </div>
          </div>

          {/* RIGHT: drawing canvas */}
          <div className="pbd-canvas">
            <div className="pbd-tabs">
              <button className={`pbd-tab ${view === "timeline" ? "active" : ""}`} onClick={() => setView("timeline")}>
                <span className="n">L1</span>TIMELINE
              </button>
              <button className={`pbd-tab ${view === "network" ? "active" : ""}`} onClick={() => setView("network")}>
                <span className="n">L2</span>NETWORK DIAGRAM
              </button>
              <button className={`pbd-tab ${view === "cost" ? "active" : ""}`} onClick={() => setView("cost")}>
                <span className="n">L3</span>COST BREAKDOWN
              </button>
              <button className={`pbd-tab ${view === "wbs" ? "active" : ""}`} onClick={() => setView("wbs")}>
                <span className="n">L4</span>WORK BREAKDOWN
              </button>
              <button className={`pbd-tab ${view === "dashboard" ? "active" : ""}`} onClick={() => setView("dashboard")}>
                <span className="n">L5</span>EXECUTIVE DASHBOARD
              </button>
            </div>
            {view === "cost" && (
              <div className="pbd-legend">
                <span><span className="pbd-dot" style={{ background: "#f2a93b" }} />Above-average cost driver</span>
                <span><span className="pbd-dot" style={{ background: "#ff9d7a" }} />Over budget (actual &gt; allocated)</span>
                <span><span className="pbd-dot" style={{ background: "#7ec8e3" }} />Standard allocation</span>
              </div>
            )}
            {view === "wbs" && (
              <div className="pbd-owner-legend">
                {wbsOwners.length === 0 ? (
                  <span>Owners appear here once the WBS is generated.</span>
                ) : (
                  wbsOwners.map((o) => (
                    <span key={o}>
                      <span className="pbd-dot" style={{ background: wbsColorFor(o, wbsOwners) }} />
                      {o}
                    </span>
                  ))
                )}
              </div>
            )}
            {(view === "timeline" || view === "network") && (
              <div className="pbd-legend">
                <span><span className="pbd-dot" style={{ background: "#f2a93b" }} />Critical path ({criticalCount})</span>
                <span><span className="pbd-dot" style={{ background: "#7ec8e3" }} />Float / slack available</span>
              </div>
            )}
            <div className="pbd-canvas-body">
              {view === "timeline" && <TimelineView tasks={tasks} cpm={cpm} project={project} />}
              {view === "network" && <NetworkView tasks={tasks} cpm={cpm} />}
              {view === "cost" && <CostView tasks={tasks} cpm={cpm} project={project} />}
              {view === "wbs" && <WBSView tasks={tasks} />}
              {view === "dashboard" && <ExecutiveDashboardView project={project} tasks={tasks} stats={execStats} />}
            </div>
            <div className="pbd-titleblock">
              <div>
                <div className="pbd-tb-label">Client</div>
                <div className="pbd-tb-value">{project.client || "—"}</div>
              </div>
              <div>
                <div className="pbd-tb-label">Location</div>
                <div className="pbd-tb-value">{project.location || "—"}</div>
              </div>
              <div>
                <div className="pbd-tb-label">Duration</div>
                <div className="pbd-tb-value">{formatShort(project.startDate)} – {formatShort(project.endDate)} ({cpm.projectDuration}d)</div>
              </div>
              <div>
                <div className="pbd-tb-label">Budget</div>
                <div className="pbd-tb-value">{formatBudget(project.budget, project.currency)}</div>
              </div>
              <div>
                <div className="pbd-tb-label">Approach</div>
                <div className="pbd-tb-value">{project.methodology}</div>
              </div>
            </div>
          </div>
        </div>
      </div>

      {showEmailModal && (
        <div className="pbd-modal-overlay">
          <div className="pbd-modal">
            <div className="pbd-modal-title">You've used your {FREE_TRY_LIMIT} free generations</div>
            <p className="pbd-modal-body">
              Enter your name and email to subscribe and keep generating — no password needed.
            </p>
            <span className="pbd-label" style={{ marginTop: 0 }}>Full name</span>
            <input
              type="text"
              autoFocus
              className="pbd-input"
              placeholder="Jane Cruz"
              value={nameDraft}
              onChange={(e) => setNameDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && confirmEmail()}
            />
            <span className="pbd-label">Email</span>
            <input
              type="email"
              className="pbd-input"
              placeholder="you@company.com"
              value={emailDraft}
              onChange={(e) => setEmailDraft(e.target.value)}
              onKeyDown={(e) => e.key === "Enter" && confirmEmail()}
            />
            <div className="pbd-modal-actions">
              <button className="pbd-modal-btn-secondary" onClick={cancelEmail} type="button">
                Cancel
              </button>
              <button
                className="pbd-modal-btn-primary"
                onClick={confirmEmail}
                type="button"
                disabled={!nameDraft.trim() || !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailDraft.trim())}
              >
                Continue
              </button>
            </div>
          </div>
        </div>
      )}

      {showPaywall && (
        <div className="pbd-modal-overlay">
          <div className="pbd-modal">
            <div className="pbd-modal-title">Choose your plan</div>
            <p className="pbd-modal-body">
              Unlock unlimited Generate Activities, Generate WBS, and Generate Executive Summary for a fixed period.
              This isn't an auto-renewing subscription — you pay once for the period, and pay again when it ends.
            </p>
            <div className="pbd-plan-toggle">
              <button
                type="button"
                className={`pbd-plan-option ${selectedPlan === "monthly" ? "active" : ""}`}
                onClick={() => setSelectedPlan("monthly")}
              >
                <div className="pbd-plan-name">{MONTHLY_PRICE_LABEL}</div>
                <div className="pbd-plan-sub">30 days of unlimited access</div>
              </button>
              <button
                type="button"
                className={`pbd-plan-option ${selectedPlan === "annual" ? "active" : ""}`}
                onClick={() => setSelectedPlan("annual")}
              >
                <div className="pbd-plan-name">{ANNUAL_PRICE_LABEL}</div>
                <div className="pbd-plan-sub">365 days — best value</div>
              </button>
            </div>
            <p className="pbd-modal-body" style={{ fontSize: 11, opacity: 0.7, marginTop: 10, marginBottom: 0 }}>
              Pay via GCash, Maya, card, or other PayMongo-supported methods on the next screen.
            </p>
            <div className="pbd-modal-actions">
              <button className="pbd-modal-btn-secondary" onClick={() => setShowPaywall(false)} type="button">
                Not now
              </button>
              <button className="pbd-modal-btn-primary" onClick={startCheckout} disabled={checkoutLoading} type="button">
                {checkoutLoading ? "Redirecting…" : `Get ${selectedPlan === "monthly" ? "Monthly" : "Annual"} Access`}
              </button>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<ProjectBlueprintDesigner />);
</script>
</body>
</html>
